<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFD9C4">
<meta name="description" content="Bikin matcha digital pengembali mood, khusus buat kamu.">
<title>Matcha untukmu</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Matcha">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preload" href="/fonts/fredoka-latin-600-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/css/fonts.css">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs id="defs">
<symbol id="mascot" viewBox="0 0 60 60">
 <ellipse cx="30" cy="49" rx="22" ry="7" fill="#F3E7C9" stroke="#6B7A4B" stroke-width="2"/>
 <path d="M12 26H48Q48 46 30 46Q12 46 12 26Z" fill="#FBF3DC" stroke="#6B7A4B" stroke-width="2.5"/>
 <path d="M47 29Q58 28 55 37Q52 41 46 40" fill="none" stroke="#6B7A4B" stroke-width="2.5"/>
 <ellipse cx="30" cy="26" rx="18" ry="4.5" fill="#A6C06B" stroke="#6B7A4B" stroke-width="2"/>
 <path d="M34 22Q36 9 47 9Q45 22 34 22Z" fill="#8FB04F" stroke="#6B7A4B" stroke-width="2"/>
 <circle cx="23" cy="35" r="2" fill="#5a4636"/><circle cx="37" cy="35" r="2" fill="#5a4636"/>
 <circle cx="19" cy="38" r="3" fill="#F6B8C6" opacity=".8"/><circle cx="41" cy="38" r="3" fill="#F6B8C6" opacity=".8"/>
 <path d="M27 38Q30 41 33 38" fill="none" stroke="#5a4636" stroke-width="2" stroke-linecap="round"/>
</symbol>
<symbol id="sak" viewBox="-20 -20 40 40">
 <g fill="#F9C6D1" stroke="#c97a90" stroke-width="1.2">
 <ellipse cy="-9" rx="6.5" ry="9"/><ellipse cy="-9" rx="6.5" ry="9" transform="rotate(72)"/><ellipse cy="-9" rx="6.5" ry="9" transform="rotate(144)"/><ellipse cy="-9" rx="6.5" ry="9" transform="rotate(216)"/><ellipse cy="-9" rx="6.5" ry="9" transform="rotate(288)"/>
 </g><circle r="3" fill="#E58AA0"/>
</symbol>
<clipPath id="inside"><path d="M72 100L98 300Q100 322 125 322L255 322Q280 322 282 300L308 100Z"/></clipPath>
<clipPath id="ac"><ellipse cx="190" cy="100" rx="108" ry="26"/></clipPath>
</defs></svg>
<canvas id="cf"></canvas>
<main id="app">
 <div class="top"><div id="dots" aria-hidden="true"></div><div class="right"><button id="install" hidden>Pasang app</button><button id="mute" aria-label="Suara nyala atau mati">🔊</button></div></div>
 <div class="say"><button class="mini" id="mini" aria-label="Maskot"><svg viewBox="0 0 60 60"><use href="#mascot"/></svg></button><div id="bubble" role="status" aria-live="polite"></div></div>
 <div class="stage">
  <svg id="mug" viewBox="0 0 400 370" role="img" aria-label="Gelas matcha latte">
   <ellipse cx="190" cy="340" rx="150" ry="30" fill="#A8683F"/>
   <ellipse cx="190" cy="328" rx="150" ry="30" fill="#D49A68" stroke="#8a5a36" stroke-width="3"/>
   <path d="M300 130C385 110 392 235 290 262" fill="none" stroke="#6B7A4B" stroke-width="26" stroke-linecap="round"/>
   <path d="M300 130C385 110 392 235 290 262" fill="none" stroke="#CFE3C2" stroke-width="18" stroke-linecap="round"/>
   <path d="M72 100L98 300Q100 322 125 322L255 322Q280 322 282 300L308 100Z" fill="#E6F0DA" fill-opacity=".75"/>
   <g clip-path="url(#inside)"><rect id="gr" x="60" y="322" width="260" height="0" fill="#A6C06B"/><rect id="cr" x="60" y="322" width="260" height="0" fill="#FBF3DC"/></g>
   <ellipse id="surf" cx="190" cy="322" rx="110" ry="28" fill="#A9C274" stroke="#8FA85F" stroke-width="2" style="display:none"/>
   <g id="art" clip-path="url(#ac)"></g>
   <path d="M72 100L98 300Q100 322 125 322L255 322Q280 322 282 300L308 100Z" fill="none" stroke="#6B7A4B" stroke-width="4" stroke-linejoin="round"/>
   <ellipse cx="190" cy="100" rx="118" ry="30" fill="none" stroke="#6B7A4B" stroke-width="4"/>
   <path d="M90 140L106 285" stroke="#fff" stroke-width="6" stroke-linecap="round" opacity=".55"/>
   <use href="#mascot" x="148" y="172" width="84" height="84"/>
   <g id="deco" style="opacity:0;transition:opacity .8s">
    <use href="#sak" x="250" y="50" width="60" height="60"/><use href="#sak" x="26" y="262" width="62" height="62"/><use href="#sak" x="66" y="298" width="46" height="46"/>
    <ellipse cx="128" cy="108" rx="8" ry="5" fill="#F9C6D1" transform="rotate(-25 128 108)"/><ellipse cx="248" cy="116" rx="8" ry="5" fill="#F9C6D1" transform="rotate(30 248 116)"/><ellipse cx="300" cy="336" rx="9" ry="6" fill="#F9C6D1" transform="rotate(-15 300 336)"/>
   </g>
   <ellipse id="pad" cx="190" cy="100" rx="114" ry="30" fill="transparent" style="display:none;cursor:crosshair"/>
  </svg>
  <svg id="bowl" viewBox="0 0 400 370" role="img" aria-label="Mangkuk matcha" hidden>
   <ellipse cx="200" cy="336" rx="140" ry="18" fill="#C58B5C" opacity=".4"/>
   <path d="M52 178Q62 328 200 334Q338 328 348 178Z" fill="#F7E7CB" stroke="#7a5a3a" stroke-width="4"/>
   <ellipse cx="200" cy="178" rx="148" ry="44" fill="#FBF3DC" stroke="#7a5a3a" stroke-width="4"/>
   <clipPath id="lc"><ellipse cx="200" cy="182" rx="132" ry="34"/></clipPath>
   <ellipse id="liq" cx="200" cy="182" rx="132" ry="34" fill="#d8e8bd"/>
   <g id="foam" clip-path="url(#lc)"></g>
   <g id="whisk" transform="translate(200 164)">
    <rect x="-8" y="-120" width="16" height="84" rx="8" fill="#d9b77e" stroke="#a97c45" stroke-width="3"/>
    <path d="M-18 -38Q-28 6 0 20Q28 6 18 -38Z" fill="#ecd3a0" stroke="#a97c45" stroke-width="3"/>
    <path d="M-8 -34Q-10 4 0 16M8 -34Q10 4 0 16" fill="none" stroke="#a97c45" stroke-width="2"/>
   </g>
  </svg>
 </div>
 <section id="panel"></section>
</main>
<noscript>Game ini butuh JavaScript. Aktifkan dulu ya.</noscript>
<script src="/config.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
